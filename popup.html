<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Style Spy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <div class="top">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="brand">
      <h1>Style Spy</h1>
      <p>Steal the style. Save the system.</p>
    </div>
    <button class="btn small" id="openDash" title="Open your saved design kits">My kits <span id="kitCount">0</span></button>
  </div>
  <div class="site-pill" id="sitePill"></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="colors" role="tab">Colours</button>
    <button class="tab" data-tab="type" role="tab">Typography</button>
    <button class="tab" data-tab="inspect" role="tab">Inspect</button>
    <button class="tab" data-tab="export" role="tab">CSS</button>
  </nav>
  <main id="view"></main>
  <footer>
    <button class="btn primary" id="saveKit">Save as kit</button>
    <button class="btn" id="exportBtn">Export CSS</button>
  </footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
